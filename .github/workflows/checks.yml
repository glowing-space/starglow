name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main, "dependabot/**"]

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, check, build, links, dist assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for git-based note dates)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run site checks
        uses: ./.github/actions/site-checks
